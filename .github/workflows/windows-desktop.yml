name: Windows desktop

on:
  push:
    branches: [main]
    paths: ['workbench/**', '.github/workflows/windows-desktop.yml']
  pull_request:
    paths: ['workbench/**', '.github/workflows/windows-desktop.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desktop:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install workbench dependencies
        working-directory: workbench/console
        run: |
          npm ci
          python -m pip install -r requirements.txt
          npx --no-install playwright-core install --only-shell chromium
      - name: Run unit tests on Windows
        working-directory: workbench/console
        run: npm test
      - name: Build the Windows desktop package
        working-directory: workbench/console
        env:
          ARACHNE_PACKAGE_OUTPUT_DIR: ${{ runner.temp }}/arachne-windows
        run: npm run package:win
      - name: Verify the extracted desktop package
        working-directory: workbench/console
        timeout-minutes: 12
        env:
          ARACHNE_PACKAGE_OUTPUT_DIR: ${{ runner.temp }}/arachne-windows
          ARACHNE_DESKTOP_SCREENSHOTS: ${{ runner.temp }}/arachne-screenshots
        run: |
          $archive = Get-ChildItem -Path $env:ARACHNE_PACKAGE_OUTPUT_DIR -Filter '*.zip' | Select-Object -First 1
          if (!$archive) { throw 'Desktop ZIP is missing' }
          $hash = (Get-Content ($archive.FullName + '.sha256')).Split(' ')[0]
          if ((Get-FileHash $archive.FullName -Algorithm SHA256).Hash -ne $hash) { throw 'Desktop ZIP checksum mismatch' }
          $extracted = Join-Path $env:RUNNER_TEMP '阿拉克涅 包验证'
          python -m zipfile -e $archive.FullName $extracted
          if ($LASTEXITCODE -ne 0) { throw 'Desktop ZIP extraction failed' }
          Write-Host 'Desktop ZIP checksum and extraction verified'
          $executable = Join-Path (Join-Path $extracted $archive.BaseName) 'Arachne.exe'
          node tests/windows-desktop-integration.mjs $executable
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: windows-workbench-screenshots
          path: ${{ runner.temp }}/arachne-screenshots
          if-no-files-found: ignore
          retention-days: 7
